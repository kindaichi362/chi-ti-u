<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Mộc Mộc preview</title>
<style>body{margin:0;background:#F6F5F1;font:14px system-ui}#ui{position:fixed;top:8px;left:8px;display:flex;gap:6px;flex-wrap:wrap}button{padding:6px 10px;border:1px solid #ccc;border-radius:8px;background:#fff}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="ui"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const stage = q.get('stage') || '1', clipName = q.get('clip') || 'idle', time = q.get('t');
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
const W = () => innerWidth || 800, Hh = () => innerHeight || 600;
r.setSize(W(), Hh()); r.setPixelRatio(devicePixelRatio || 1); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping;
r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
const thumb = q.has('thumb');
const scene = new THREE.Scene(); if (!thumb) scene.background = new THREE.Color('#F6F5F1');
if (thumb) { r.setClearColor(0x000000, 0); r.setSize(512, 512, false); }
const cam = new THREE.PerspectiveCamera(32, W() / Hh(), 0.1, 50);
addEventListener("resize", () => { r.setSize(W(), Hh()); cam.aspect = W() / Hh(); cam.updateProjectionMatrix(); }); cam.position.set(1.1, 1.0, 3.0); cam.lookAt(0, 0.5, 0);
scene.add(new THREE.HemisphereLight('#ffffff', '#cfe8dc', 1.6));
const sun = new THREE.DirectionalLight('#fff4e0', 2.2); sun.position.set(2, 4, 3); sun.castShadow = true; scene.add(sun);
const floor = thumb ? new THREE.Group() : new THREE.Mesh(new THREE.CircleGeometry(1.4, 48), new THREE.MeshStandardMaterial({ color: '#E8E1D3' })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
if (thumb) { cam.aspect = 1; cam.fov = 30; cam.position.set(0.9, 0.9, 3.1); cam.lookAt(0, 0.52, 0); cam.updateProjectionMatrix(); }
const ui = document.getElementById('ui');
['idle','happy','sleep','eat','walk','play','levelup','touch'].forEach(c => { const b = document.createElement('button'); b.textContent = c; b.onclick = () => location.search = `?stage=${stage}&clip=${c}`; ui.appendChild(b); });
[1,2,3,4,5,6].forEach(s => { const b = document.createElement('button'); b.textContent = 'giai đoạn ' + s; b.onclick = () => location.search = `?stage=${s}&clip=${clipName}`; ui.appendChild(b); });
let mixer;
new GLTFLoader().load(`/assets/dragon/mocmoc_stage${stage}.glb`, g => {
  g.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
  scene.add(g.scene);
  mixer = new THREE.AnimationMixer(g.scene);
  const clip = g.animations.find(a => a.name === clipName); const act = mixer.clipAction(clip); act.play();
  if (time) { mixer.setTime(parseFloat(time) * clip.duration); }
  window.snap = () => {
    // Frame the whole model (wings and halo included) with a little margin, in a square canvas.
    r.setPixelRatio(1); r.setSize(512, 512, false);
    const box = new THREE.Box3().setFromObject(g.scene), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
    const radius = Math.max(sz.x, sz.y) * 0.58, d = radius / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
    const dir = new THREE.Vector3(0.28, 0.2, 1).normalize();
    cam.aspect = 1; cam.position.copy(c).addScaledVector(dir, d); cam.lookAt(c); cam.updateProjectionMatrix();
    r.render(scene, cam); return r.domElement.toDataURL('image/png');
  };
  window.ready = true;
});
const clock = new THREE.Clock();
(function loop(){ requestAnimationFrame(loop); if (mixer && !time) mixer.update(clock.getDelta()); r.render(scene, cam); })();
</script></body></html>
